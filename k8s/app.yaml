# Deploy with:
#   aws eks update-kubeconfig --name cm-eks-au --region ap-southeast-2
#   kubectl apply -f k8s/app.yaml
#   kubectl get service case-manager     (the EXTERNAL-IP column is the address to open)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: case-manager
spec:
  replicas: 2
  selector:
    matchLabels:
      app: case-manager
  strategy:
    rollingUpdate:
      maxUnavailable: 0   # zero downtime: start a new pod before stopping an old one
      maxSurge: 1
  template:
    metadata:
      labels:
        app: case-manager
    spec:
      topologySpreadConstraints:      # put the two pods in different zones
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: case-manager
      containers:
        - name: app
          image: public.ecr.aws/nginx/nginx:stable   # placeholder until the real app is pushed
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: case-manager
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
spec:
  type: LoadBalancer
  selector:
    app: case-manager
  ports:
    - port: 80
      targetPort: 80
