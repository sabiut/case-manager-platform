# Deploys one layer of one project to the regions you choose, in the order you choose, one region at a time.
# Started by hand from the Actions tab.
#
#   Layer foundation = network + database + image registry. Slow (about 25 minutes), done once per region.
#   Layer app        = load balancers + firewall + frontend and backend API. Fast, deploy and destroy as often as you like.
#
#   Every project is three tiers: frontend -> backend API -> database.
#   Only the frontend is reachable from the internet. Only the backend API can reach the database.
#
#   Deploy order:  foundation, then (build workflow), then app.
#   Destroy order: app first, then foundation.
#
#   First region  = deployed first.
#   Second region = starts only after the first has finished and passed its health check.
#   Third region  = starts only after the second has finished and passed its health check.
#   If any region fails, the regions after it are not touched.
name: deploy

on:
  workflow_dispatch:
    inputs:
      project:
        description: What the frontend and backend API run on
        type: choice
        options: [ecs, ec2, eks]
        default: ecs
      layer:
        description: Which layer
        type: choice
        options: [foundation, app]
        default: foundation
      action:
        description: What to do
        type: choice
        options: [plan, apply, destroy]
        default: plan
      first:
        description: First region
        type: choice
        options: [au, uk, us]
        default: au
      second:
        description: Second region (starts after the first is healthy)
        type: choice
        options: [none, au, uk, us]
        default: none
      third:
        description: Third region (starts after the second is healthy)
        type: choice
        options: [none, au, uk, us]
        default: none
      image_tag:
        description: "App layer, ECS only: image tag from the build workflow (empty = placeholder page)"
        type: string
        default: ""
      database:
        description: "Foundation layer only: database setup"
        type: choice
        options: [express, standard-multi-az]
        default: standard-multi-az
      protect_data:
        description: "Foundation layer only: real-data protection (deletion protection, final snapshot)"
        type: boolean
        default: false
      confirm_destroy:
        description: To destroy, type the word destroy here (safety check)
        type: string
        default: ""

permissions:
  id-token: write # lets the job ask GitHub for the token it swaps for AWS credentials
  contents: read

# Never run two deployments of the same project and layer at once.
concurrency:
  group: deploy-${{ inputs.project }}-${{ inputs.layer }}
  cancel-in-progress: false

jobs:
  # Turns the three choices into an ordered list, for example ["uk","au"], and rejects duplicates.
  order:
    name: rollout order
    runs-on: ubuntu-latest
    outputs:
      regions: ${{ steps.build.outputs.regions }}
    steps:
      - id: build
        env:
          FIRST: ${{ inputs.first }}
          SECOND: ${{ inputs.second }}
          THIRD: ${{ inputs.third }}
          ACTION: ${{ inputs.action }}
          CONFIRM: ${{ inputs.confirm_destroy }}
        run: |
          if [ "$ACTION" = "destroy" ] && [ "$CONFIRM" != "destroy" ]; then
            echo "::error::Destroy was chosen but the confirmation box does not say 'destroy'. Nothing was changed."
            exit 1
          fi
          list=()
          for region in "$FIRST" "$SECOND" "$THIRD"; do
            [ "$region" = "none" ] && continue
            for seen in "${list[@]}"; do
              if [ "$seen" = "$region" ]; then
                echo "::error::Region '$region' was chosen more than once"
                exit 1
              fi
            done
            list+=("$region")
          done
          json=$(printf '"%s",' "${list[@]}")
          echo "regions=[${json%,}]" >> "$GITHUB_OUTPUT"
          {
            echo "### Rollout order"
            echo "Project: **${{ inputs.project }}**, layer: **${{ inputs.layer }}**, action: **$ACTION**"
            n=1
            for region in "${list[@]}"; do echo "$n. $region"; n=$((n+1)); done
          } >> "$GITHUB_STEP_SUMMARY"

  terraform:
    name: ${{ inputs.action }} ${{ inputs.project }} ${{ inputs.layer }} ${{ matrix.region }}
    needs: order
    runs-on: ubuntu-latest
    timeout-minutes: 110
    # One GitHub environment per region (au, uk, us). Add "required reviewers" to an environment
    # in the repository settings and that region waits for a person to approve before it starts.
    environment: ${{ matrix.region }}
    strategy:
      max-parallel: 1 # one region at a time, in the order of the list
      fail-fast: true # a failed region cancels the ones after it
      matrix:
        region: ${{ fromJSON(needs.order.outputs.regions) }}
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_image_tag: ${{ inputs.image_tag }}
      TF_VAR_protect_data: ${{ inputs.protect_data }}
      # The AWS region this job deploys to, for the AWS CLI steps below.
      DEPLOY_REGION: ${{ fromJSON('{"au":"ap-southeast-2","uk":"eu-west-2","us":"us-east-1"}')[matrix.region] }}
    defaults:
      run:
        working-directory: projects/${{ inputs.project }}/${{ matrix.region }}/${{ inputs.layer }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false # plain output, so "terraform output -raw" works in scripts

      - name: Sign in to AWS (no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-2
          role-duration-seconds: 7200
          mask-aws-account-id: true # this repository is public: print *** instead of the account ID in logs

      # express           = SQL Server Express, one zone. Cheap, for normal lab use.
      # standard-multi-az = SQL Server Standard with a standby in a second zone. Costs several dollars an hour.
      - name: Database settings
        run: |
          if [ "${{ inputs.database }}" = "standard-multi-az" ]; then
            echo "TF_VAR_db_engine=sqlserver-se"        >> "$GITHUB_ENV"
            echo "TF_VAR_db_instance_class=db.t3.xlarge" >> "$GITHUB_ENV"
            echo "TF_VAR_db_multi_az=true"               >> "$GITHUB_ENV"
          else
            echo "TF_VAR_db_engine=sqlserver-ex"        >> "$GITHUB_ENV"
            echo "TF_VAR_db_instance_class=db.t3.micro"  >> "$GITHUB_ENV"
            echo "TF_VAR_db_multi_az=false"              >> "$GITHUB_ENV"
          fi

      - name: Init
        run: terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"

      # ---- ECS with a real image: migrate the database BEFORE the new version is rolled out ----
      # The new API version expects its login and schema to exist. If the services were updated first,
      # healthy tasks would be replaced by tasks that cannot use the database, and a failed migration
      # would leave that broken version running. So: create only what the migration task needs,
      # run it, and stop here if it fails. The running services have not been touched at that point.
      # Order of one release: database migration -> backend API -> frontend.
      - name: Prepare the migration task (ECS)
        if: inputs.action == 'apply' && inputs.layer == 'app' && inputs.project == 'ecs' && inputs.image_tag != ''
        run: |
          terraform apply -auto-approve \
            -target='module.stack.module.app.aws_ecs_task_definition.migrate' \
            -target='module.stack.aws_vpc_security_group_ingress_rule.db_from_api'

      - name: Run the database migration (ECS)
        if: inputs.action == 'apply' && inputs.layer == 'app' && inputs.project == 'ecs' && inputs.image_tag != ''
        env:
          NAME: cm-ecs-${{ matrix.region }}
        run: |
          # The migration runs where the backend API runs: the app subnets, with the API's security group.
          # Looked up by name rather than from Terraform outputs, which are not complete after a targeted apply.
          vpc=$(aws ec2 describe-vpcs --region "$DEPLOY_REGION" --filters "Name=tag:Name,Values=$NAME" --query 'Vpcs[0].VpcId' --output text)
          subnets=$(aws ec2 describe-subnets --region "$DEPLOY_REGION" --filters "Name=vpc-id,Values=$vpc" "Name=tag:Tier,Values=app" --query 'Subnets[].SubnetId' --output json | jq -c .)
          group=$(aws ec2 describe-security-groups --region "$DEPLOY_REGION" --filters "Name=vpc-id,Values=$vpc" "Name=group-name,Values=$NAME-api" --query 'SecurityGroups[0].GroupId' --output text)
          network="{\"awsvpcConfiguration\":{\"subnets\":$subnets,\"securityGroups\":[\"$group\"],\"assignPublicIp\":\"DISABLED\"}}"

          if [ "$vpc" = "None" ] || [ "$group" = "None" ] || [ "$subnets" = "[]" ]; then
            echo "::error::Could not find the network for $NAME (vpc=$vpc, security group=$group, subnets=$subnets). Deploy the foundation layer first."
            exit 1
          fi

          # The rule throughout: only start another task when it is CERTAIN the previous one did not run.
          #   1. The start request fails. It is not known whether AWS started a task, so the request is
          #      repeated with the SAME client token. AWS then returns the task it already started
          #      instead of starting a second one.
          #   2. AWS confirms the task failed to start (stop code TaskFailedToStart, container never ran).
          #      On a first deployment the task's permissions are seconds old, so this is retried
          #      with a new token.
          #   3. The task is still running when the wait runs out, or its result cannot be read.
          #      Nothing new is started. The step fails and names the task.
          #   4. The migration ran and failed. That is a real error in the migration, so it is not retried.

          # Reads the task, retrying the SAME task if the read fails. Prints nothing if it cannot be read.
          inspect() {
            local try out
            for try in 1 2 3 4 5; do
              if out=$(aws ecs describe-tasks --region "$DEPLOY_REGION" --cluster "$NAME" --tasks "$task" --output json 2>/dev/null) \
                && [ "$(jq -r '.tasks | length' <<<"$out")" = "1" ]; then
                jq -c '.tasks[0]' <<<"$out"
                return 0
              fi
              sleep 10
            done
            return 1
          }
          unknown() {
            echo "::error::$1 No second migration was started, because this one may have run. Check this task, then run the deployment again: $task"
            exit 1
          }

          launch=1
          uncertain=no
          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then sleep 30; fi
            token="mig-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$DEPLOY_REGION-$launch"

            if ! response=$(aws ecs run-task --region "$DEPLOY_REGION" --cluster "$NAME" --launch-type FARGATE \
              --task-definition "$NAME-migrate" --network-configuration "$network" \
              --client-token "$token" --output json 2>run-task.err); then
              echo "Attempt $attempt: the request to start the task failed, repeating it with the same token: $(cat run-task.err)"
              uncertain=yes
              continue
            fi

            # A successful response can still contain no task, with the reason in "failures".
            # That is a definite "nothing was started", so the next request gets a new token.
            task=$(jq -r '.tasks[0].taskArn // empty' <<<"$response")
            if [[ "$task" != arn:aws*:ecs:* ]]; then
              echo "Attempt $attempt: ECS did not start a task:"
              jq -r '.failures[]? | "  \(.reason // "no reason given") \(.detail // "")"' <<<"$response"
              launch=$((launch + 1))
              uncertain=no
              continue
            fi
            echo "Attempt $attempt: started $task, waiting for it to finish"

            # One wait lasts up to 10 minutes. Wait up to three times (30 minutes) for the SAME task.
            status=""
            for round in 1 2 3; do
              aws ecs wait tasks-stopped --region "$DEPLOY_REGION" --cluster "$NAME" --tasks "$task" || true
              details=$(inspect) || unknown "The migration task could not be read."
              status=$(jq -r '.lastStatus' <<<"$details")
              if [ "$status" = "STOPPED" ]; then break; fi
              echo "Still waiting (task status: $status)"
            done
            if [ "$status" != "STOPPED" ]; then
              unknown "The migration task has not finished after 30 minutes (status: $status) and was left running."
            fi

            aws logs tail "/$NAME/app" --region "$DEPLOY_REGION" --log-stream-name-prefix migrate --since 40m --format short || true
            code=$(jq -r '.containers[0].exitCode // "none"' <<<"$details")
            stop_code=$(jq -r '.stopCode // "none"' <<<"$details")
            reason=$(jq -r '.stoppedReason // "no reason given"' <<<"$details")

            if [ "$code" = "0" ]; then
              echo "Migration succeeded"
              exit 0
            fi
            if [ "$code" != "none" ]; then
              echo "::error::The migration ran and failed (exit code $code): $reason. The app service was NOT updated, and later regions will not be deployed."
              exit 1
            fi
            if [ "$stop_code" != "TaskFailedToStart" ]; then
              unknown "The migration task stopped without an exit code (stop code: $stop_code, $reason)."
            fi
            echo "Attempt $attempt: AWS confirmed the task failed to start: $reason"
            launch=$((launch + 1))
            uncertain=no
          done
          if [ "$uncertain" = "yes" ]; then
            echo "::error::The last request to start the migration got no answer from AWS, so a task may be running. Check the tasks in cluster $NAME before running the deployment again."
            exit 1
          fi
          echo "::error::The migration task could not be started after 3 attempts. The app service was NOT updated, and later regions will not be deployed."
          exit 1

      - name: Plan
        if: inputs.action != 'destroy'
        run: terraform plan -out=tfplan

      # Apply exactly the plan shown in the step above, nothing else.
      - name: Apply
        if: inputs.action == 'apply'
        run: terraform apply tfplan

      # ---- ECS with a real image: prove the NEW version is running before moving on ----
      # A plain "is the site up?" check is not enough: during a rolling deployment an old container
      # can answer while the new version is failing and being rolled back.

      - name: Check both services finished on the requested version (ECS)
        if: inputs.action == 'apply' && inputs.layer == 'app' && inputs.project == 'ecs' && inputs.image_tag != ''
        run: |
          cluster=$(terraform output -raw cluster_name)
          for service in api web; do
            wanted=$(terraform output -raw "${service}_task_definition_arn")
            aws ecs wait services-stable --region "$DEPLOY_REGION" --cluster "$cluster" --services "$service"
            read -r state running_def running desired < <(aws ecs describe-services --region "$DEPLOY_REGION" \
              --cluster "$cluster" --services "$service" --output text \
              --query "services[0].deployments[?status=='PRIMARY'] | [0].[rolloutState,taskDefinition,runningCount,desiredCount]")
            echo "$service: rollout state $state, running $running of $desired"
            if [ "$running_def" != "$wanted" ]; then
              echo "::error::The $service service is NOT running the requested version. ECS rolled back to the previous one."
              exit 1
            fi
            if [ "$state" != "COMPLETED" ] || [ "$running" != "$desired" ]; then
              echo "::error::The $service deployment did not complete (state $state, $running of $desired running)."
              exit 1
            fi
          done
          echo "The requested version is running on every frontend and API task."

      # /ready on the frontend calls the API, and the API queries its database, so one request
      # tests the whole chain. The answer names the frontend version and the API version.
      - name: Smoke test through all three tiers (ECS)
        if: inputs.action == 'apply' && inputs.layer == 'app' && inputs.project == 'ecs' && inputs.image_tag != ''
        env:
          WANTED: ${{ inputs.image_tag }}
        run: |
          url="$(terraform output -raw url)/ready"
          echo "Checking $url"
          passes=0
          for attempt in $(seq 1 30); do
            body=$(curl -s --max-time 15 "$url" || true)
            status=$(echo "$body" | jq -r '.status // empty' 2>/dev/null || true)
            version=$(echo "$body" | jq -r '.version // empty' 2>/dev/null || true)
            api_version=$(echo "$body" | jq -r '.api_version // empty' 2>/dev/null || true)
            if [ "$status" = "ok" ] && [ "$version" = "$WANTED" ] && [ "$api_version" = "$WANTED" ]; then
              passes=$((passes+1))
              # Five in a row, so every task behind both load balancers has very likely answered.
              if [ "$passes" -ge 5 ]; then echo "Healthy: frontend $version -> API $api_version -> database"; exit 0; fi
              sleep 2
              continue
            fi
            passes=0
            echo "Attempt $attempt: status='$status' frontend='$version' api='$api_version', waiting 10 seconds"
            sleep 10
          done
          echo "::error::${{ matrix.region }} did not pass the smoke test. Later regions will not be deployed."
          exit 1

      # ---- EC2, and ECS with the placeholder page: wait for the site to answer ----
      # Windows servers can take 15 minutes to boot.
      - name: Health check
        if: inputs.action == 'apply' && inputs.layer == 'app' && (inputs.project == 'ec2' || (inputs.project == 'ecs' && inputs.image_tag == ''))
        run: |
          url="$(terraform output -raw url)/"
          echo "Checking $url"
          for attempt in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$url" || true)
            if [ "$code" = "200" ]; then
              echo "Healthy after $attempt attempt(s)"
              exit 0
            fi
            echo "Attempt $attempt: HTTP $code, waiting 20 seconds"
            sleep 20
          done
          echo "::error::${{ matrix.region }} did not become healthy. Later regions will not be deployed."
          exit 1

      # Kubernetes creates its own load balancer outside Terraform. It must be gone before the cluster
      # is destroyed, otherwise it is left behind and blocks the network from being deleted.
      # Only "the cluster does not exist" is treated as nothing to do. Any other error stops the destroy.
      - name: Remove the Kubernetes app (EKS app layer only)
        if: inputs.action == 'destroy' && inputs.project == 'eks' && inputs.layer == 'app'
        working-directory: .
        run: |
          cluster="cm-eks-${{ matrix.region }}"
          if ! result=$(aws eks describe-cluster --region "$DEPLOY_REGION" --name "$cluster" --query cluster.status --output text 2>&1); then
            if echo "$result" | grep -q ResourceNotFoundException; then
              echo "Cluster $cluster does not exist, nothing to remove"
              exit 0
            fi
            echo "::error::Could not check the cluster: $result"
            exit 1
          fi
          aws eks update-kubeconfig --region "$DEPLOY_REGION" --name "$cluster"
          kubectl delete -f k8s/app.yaml --ignore-not-found --wait --timeout=10m
          left=$(kubectl get services --all-namespaces -o json | jq '[.items[] | select(.spec.type == "LoadBalancer")] | length')
          if [ "$left" != "0" ]; then
            echo "::error::$left Kubernetes load balancer service(s) still exist. Remove them before destroying the cluster."
            kubectl get services --all-namespaces
            exit 1
          fi
          echo "No Kubernetes load balancers remain"

      # foundation: removes the network, the registry and the database WITH ITS DATA.
      # app:        removes the load balancers, firewall, frontend and backend API. The data stays.
      - name: Destroy
        if: inputs.action == 'destroy'
        run: terraform destroy -auto-approve

      - name: Outputs
        if: inputs.action == 'apply'
        run: terraform output
