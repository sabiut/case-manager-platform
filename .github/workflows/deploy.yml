# Deploys one project to one region, or rolls it out to all three in order: AU, then UK, then US.
# Started by hand from the Actions tab: choose the project, the region and the action.
name: deploy

on:
  workflow_dispatch:
    inputs:
      project:
        description: Which app tier
        type: choice
        options: [ecs, ec2, eks]
        default: ecs
      region:
        description: Where
        type: choice
        options: [au, uk, us, all]
        default: au
      action:
        description: What to do
        type: choice
        options: [plan, apply, destroy]
        default: plan
      db_engine:
        description: Database edition (sqlserver-se is needed for Multi-AZ)
        type: choice
        options: [sqlserver-ex, sqlserver-se]
        default: sqlserver-ex
      db_instance_class:
        description: Database server size
        type: string
        default: db.t3.micro
      db_multi_az:
        description: Standby database in a second zone
        type: boolean
        default: false

permissions:
  id-token: write # lets the job ask GitHub for the token it swaps for AWS credentials
  contents: read

# Never run two deployments of the same project and region at once.
concurrency:
  group: deploy-${{ inputs.project }}-${{ inputs.region }}
  cancel-in-progress: false

jobs:
  terraform:
    name: ${{ inputs.action }} ${{ inputs.project }} ${{ matrix.region }}
    runs-on: ubuntu-latest
    timeout-minutes: 110
    strategy:
      # One region at a time, in this order. If Australia fails, the UK and US are not touched.
      max-parallel: 1
      fail-fast: true
      matrix:
        region: ${{ inputs.region == 'all' && fromJSON('["au","uk","us"]') || fromJSON(format('["{0}"]', inputs.region)) }}
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_db_engine: ${{ inputs.db_engine }}
      TF_VAR_db_instance_class: ${{ inputs.db_instance_class }}
      TF_VAR_db_multi_az: ${{ inputs.db_multi_az }}
    defaults:
      run:
        working-directory: projects/${{ inputs.project }}/${{ matrix.region }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1

      - name: Sign in to AWS (no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-southeast-2
          role-duration-seconds: 7200

      - name: Init
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: Plan
        if: inputs.action != 'destroy'
        run: terraform plan -out=tfplan

      # Apply exactly the plan shown in the step above, nothing else.
      - name: Apply
        if: inputs.action == 'apply'
        run: terraform apply tfplan

      - name: Destroy
        if: inputs.action == 'destroy'
        run: terraform destroy -auto-approve

      - name: Outputs
        if: inputs.action == 'apply'
        run: terraform output
