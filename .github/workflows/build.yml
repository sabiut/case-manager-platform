# Tests the .NET code, builds the two app images (frontend and backend API) once, scans them, and
# pushes those same images to each region's registries. Both get the same tag, so one tag means one release.
# The usual .NET pipeline steps are all here: restore, build, test, publish (the last inside the Dockerfiles).
#   On a push that changes frontend/ or backend/:  test, build and scan only (no AWS access needed).
#   Started by hand:                               also push to the registries, ready for the deploy workflow.
name: build

on:
  push:
    branches: [main]
    paths: [frontend/**, backend/**]
  pull_request:
    paths: [frontend/**, backend/**]
  workflow_dispatch:
    inputs:
      project:
        description: Which project's registries to push to
        type: choice
        options: [ecs, eks]
        default: ecs

permissions:
  contents: read

jobs:
  test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Restores the packages, compiles the API and its tests, and runs the tests.
      # A package with a known vulnerability fails the restore, so it never reaches an image.
      - name: Test the backend API
        run: dotnet test backend/tests/Api.Tests/Api.Tests.csproj --nologo

  image:
    name: build and scan
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      # The tag is the commit ID, so every image can be traced back to the exact code.
      - id: tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # web = frontend/ folder, api = backend/ folder (which also holds the database migration).
      - name: Build
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          docker build -t "web:$TAG" --build-arg APP_VERSION="$TAG" frontend
          docker build -t "api:$TAG" --build-arg APP_VERSION="$TAG" backend

      # Report only for now. Change --exit-code to 1 to stop the pipeline on a fixable serious finding.
      - name: Vulnerability scan (operating system packages and .NET libraries)
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          for image in web api; do
            echo "::group::$image"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image \
              --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 "$image:$TAG"
            echo "::endgroup::"
          done

      - name: Save the images for the publish job
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: docker save "web:$TAG" "api:$TAG" | gzip > images.tar.gz

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: images
          path: images.tar.gz
          retention-days: 1

  publish:
    name: push to registries
    if: github.event_name == 'workflow_dispatch'
    needs: image
    runs-on: ubuntu-latest
    environment: build
    permissions:
      id-token: write
      contents: read
    env:
      TAG: ${{ needs.image.outputs.tag }}
      PROJECT: ${{ inputs.project }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: images

      # The exact images that were scanned, not a rebuild.
      - run: docker load < images.tar.gz

      - name: Sign in to AWS (no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PUBLISH_ROLE_ARN }} # may only push images, nothing else
          aws-region: ap-southeast-2
          mask-aws-account-id: true

      # A region counts only when BOTH images are there, so a release is never half published.
      - name: Push to every region that has registries
        run: |
          pushed=""
          for pair in au:ap-southeast-2 uk:eu-west-2 us:us-east-1; do
            code=${pair%%:*}; region=${pair##*:}
            if ! aws ecr describe-repositories --region "$region" \
                   --repository-names "cm-$PROJECT-$code-web" "cm-$PROJECT-$code-api" >/dev/null 2>&1; then
              echo "$code: registries not found (deploy the foundation layer there first), skipped"
              continue
            fi
            for image in web api; do
              repo="cm-$PROJECT-$code-$image"
              uri=$(aws ecr describe-repositories --region "$region" --repository-names "$repo" \
                      --query 'repositories[0].repositoryUri' --output text)
              if aws ecr describe-images --region "$region" --repository-name "$repo" --image-ids imageTag="$TAG" >/dev/null 2>&1; then
                echo "$code $image: tag $TAG is already there"
              else
                aws ecr get-login-password --region "$region" | docker login --username AWS --password-stdin "${uri%%/*}"
                docker tag "$image:$TAG" "$uri:$TAG"
                docker push "$uri:$TAG"
              fi
            done
            pushed="$pushed $code"
          done
          if [ -z "$pushed" ]; then
            echo "::error::No registries found in any region for project $PROJECT"
            exit 1
          fi
          {
            echo "### Image tag: \`$TAG\`"
            echo "Frontend and backend API images are available in:$pushed"
            echo "Use this tag in the **deploy** workflow (layer: app, image tag: $TAG)."
          } >> "$GITHUB_STEP_SUMMARY"
