# Runs on every pull request and every push to main. Needs no AWS access.
name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  terraform:
    name: format and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1

      - name: Formatting
        run: terraform fmt -check -recursive

      - name: Validate every project, region and layer
        run: |
          for dir in projects/*/{au,uk,us}/{foundation,app}; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

  security:
    name: security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so secrets committed in the past are found too

      - name: Secrets scan (passwords or keys committed to git)
        run: docker run --rm -v "$PWD:/src" zricethezav/gitleaks:latest detect --source /src --redact

      # Critical findings fail the build, unless they are in .trivyignore, the reviewed list of
      # findings this lab accepts on purpose, each with its reason.
      - name: Terraform scan, critical findings fail the build
        run: docker run --rm -v "$PWD:/src" -w /src aquasec/trivy:latest config --severity CRITICAL --exit-code 1 .

      # High findings are reported but do not fail the build yet.
      - name: Terraform scan, high findings (report only)
        run: docker run --rm -v "$PWD:/src" -w /src aquasec/trivy:latest config --severity HIGH --exit-code 0 .
